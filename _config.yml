title: Build With Claude
description: A complete beginner's guide to building real AI tools by talking to Claude. Featuring the story of Call Intelligence.
remote_theme: just-the-docs/just-the-docs
url: https://llitton.github.io
baseurl: /build-with-claude

# Color scheme — light, clean, approachable
color_scheme: light

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Aux nav (top right)
aux_links:
  "View on GitHub":
    - "https://github.com/llitton/build-with-claude"
aux_links_new_tab: true

# Footer
footer_content: "Built by <a href='https://github.com/llitton'>Laura Litton</a>. Source on <a href='https://github.com/llitton/build-with-claude'>GitHub</a>. Powered by <a href='https://just-the-docs.com'>Just the Docs</a>."

# Heading anchor links
heading_anchors: true

# Mermaid diagrams
mermaid:
  version: "10.9.0"

# Callouts (used for "Want more detail?" boxes, warnings, etc.)
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Heads up
    color: yellow
  story:
    title: From the build
    color: purple

# Back-to-top link
back_to_top: true
back_to_top_text: "Back to top"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - assets/images/README.md
  - incoming/

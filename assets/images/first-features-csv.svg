    <text x="50" y="354" font-size="13" fill="#202124">bug</text>
    <text x="190" y="354" font-size="13" fill="#202124">Login link expires too fast</text>
    <text x="450" y="354" font-size="13" fill="#202124">high</text>
    <text x="590" y="354" font-size="13" fill="#202124">Lakeside Prep</text>
    <text x="810" y="354" font-size="13" fill="#202124">"I have to re-login every time I switch tabs"</text>

    <!-- Row 10 -->
    <rect x="0" y="366" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="386" font-size="12" fill="#5f6368" text-anchor="middle">10</text>
    <line y1="398" x2="1280" y2="398" stroke="#e8eaed"/>
    <text x="50" y="386" font-size="13" fill="#202124">feature_request</text>
    <text x="190" y="386" font-size="13" fill="#202124">Show full year of points in parent app</text>
    <text x="450" y="386" font-size="13" fill="#202124">high</text>
    <text x="590" y="386" font-size="13" fill="#202124">Westfield Academy</text>
    <text x="810" y="386" font-size="13" fill="#202124">"Parents keep asking why they only see the week"</text>


    <rect x="0" y="238" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="258" font-size="12" fill="#5f6368" text-anchor="middle">6</text>
    <line y1="270" x2="1280" y2="270" stroke="#e8eaed"/>
    <text x="50" y="258" font-size="13" fill="#202124">feature_request</text>
    <text x="190" y="258" font-size="13" fill="#202124">Custom date ranges in reports</text>
    <text x="450" y="258" font-size="13" fill="#202124">high</text>
    <text x="590" y="258" font-size="13" fill="#202124">Westfield Academy</text>
    <text x="810" y="258" font-size="13" fill="#202124">"Need to filter by quarter for board meetings"</text>


    <text x="450" y="290" font-size="13" fill="#202124">high</text>
    <text x="590" y="290" font-size="13" fill="#202124">Northbrook Middle</text>
    <text x="810" y="290" font-size="13" fill="#202124">"Manually adding 800 students is brutal"</text>


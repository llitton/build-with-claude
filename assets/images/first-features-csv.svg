    <rect x="24" y="24" width="14" height="1.5" fill="#ffffff"/>
    <rect x="24" y="28" width="14" height="1.5" fill="#ffffff"/>
    <rect x="24" y="32" width="14" height="1.5" fill="#ffffff"/>

    <!-- File title (looks unformatted, like a freshly-saved csv) -->
    <text x="56" y="28" font-size="15" fill="#202124">feature-requests-march.csv</text>
    <text x="56" y="46" font-size="11" fill="#5f6368">Last edit was 2 minutes ago · Saved to Drive</text>

    <!-- Spreadsheet column letter row -->
    <rect y="56" width="1280" height="22" fill="#f8f9fa"/>
    <rect y="77" width="1280" height="1" fill="#e8eaed"/>

    <!-- Row 0 corner cell -->

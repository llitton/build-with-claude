    <rect x="0" y="78" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="98" font-size="12" fill="#5f6368" text-anchor="middle">1</text>
    <line y1="110" x2="1280" y2="110" stroke="#e8eaed"/>
    <text x="50" y="98" font-size="13" fill="#202124">type</text>
    <text x="190" y="98" font-size="13" fill="#202124">summary</text>
    <text x="450" y="98" font-size="13" fill="#202124">urgency</text>
    <text x="590" y="98" font-size="13" fill="#202124">school</text>
    <text x="810" y="98" font-size="13" fill="#202124">quote</text>

    <!-- Data rows -->
    <!-- Row 2 -->
    <rect x="0" y="110" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="130" font-size="12" fill="#5f6368" text-anchor="middle">2</text>
    <line y1="142" x2="1280" y2="142" stroke="#e8eaed"/>
    <text x="50" y="130" font-size="13" fill="#202124">feature_request</text>
    <text x="190" y="130" font-size="13" fill="#202124">Custom date ranges in reports</text>
    <text x="450" y="130" font-size="13" fill="#202124">high</text>
    <text x="590" y="130" font-size="13" fill="#202124">ABC Elementary</text>
    <text x="810" y="130" font-size="13" fill="#202124">"I need to pull September through December"</text>


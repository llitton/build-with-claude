    <rect x="0" y="142" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="162" font-size="12" fill="#5f6368" text-anchor="middle">3</text>
    <line y1="174" x2="1280" y2="174" stroke="#e8eaed"/>
    <text x="50" y="162" font-size="13" fill="#202124">feature_request</text>
    <text x="190" y="162" font-size="13" fill="#202124">Show full year of points in parent app</text>
    <text x="450" y="162" font-size="13" fill="#202124">high</text>
    <text x="590" y="162" font-size="13" fill="#202124">ABC Elementary</text>
    <text x="810" y="162" font-size="13" fill="#202124">"Parents want to see the whole year"</text>


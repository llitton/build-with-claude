    <text x="260" y="72" font-size="12" fill="#5f6368" text-anchor="middle">B</text>
    <text x="510" y="72" font-size="12" fill="#5f6368" text-anchor="middle">C</text>
    <text x="640" y="72" font-size="12" fill="#5f6368" text-anchor="middle">D</text>
    <text x="900" y="72" font-size="12" fill="#5f6368" text-anchor="middle">E</text>


    <text x="450" y="418" font-size="13" fill="#202124">medium</text>
    <text x="590" y="418" font-size="13" fill="#202124">Northbrook Middle</text>
    <text x="810" y="418" font-size="13" fill="#202124">"5th graders need different rewards than 8th"</text>

    <!-- Row 12 -->
    <rect x="0" y="430" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="450" font-size="12" fill="#5f6368" text-anchor="middle">12</text>
    <line y1="462" x2="1280" y2="462" stroke="#e8eaed"/>
    <text x="50" y="450" font-size="13" fill="#202124">feature_request</text>
    <text x="190" y="450" font-size="13" fill="#202124">Export gradebook to PDF</text>
    <text x="450" y="450" font-size="13" fill="#202124">medium</text>
    <text x="590" y="450" font-size="13" fill="#202124">Westfield Academy</text>
    <text x="810" y="450" font-size="13" fill="#202124">"Need PDFs for parent conferences"</text>

    <!-- Empty rows for visual continuity -->
    <rect x="0" y="462" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="482" font-size="12" fill="#5f6368" text-anchor="middle">13</text>
    <line y1="494" x2="1280" y2="494" stroke="#e8eaed"/>

    <rect x="0" y="494" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="514" font-size="12" fill="#5f6368" text-anchor="middle">14</text>
    <line y1="526" x2="1280" y2="526" stroke="#e8eaed"/>

    <rect x="0" y="526" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="546" font-size="12" fill="#5f6368" text-anchor="middle">15</text>
    <line y1="558" x2="1280" y2="558" stroke="#e8eaed"/>

    <rect x="0" y="558" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="578" font-size="12" fill="#5f6368" text-anchor="middle">16</text>
    <line y1="590" x2="1280" y2="590" stroke="#e8eaed"/>

    <rect x="0" y="590" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="610" font-size="12" fill="#5f6368" text-anchor="middle">17</text>
    <line y1="622" x2="1280" y2="622" stroke="#e8eaed"/>

    <rect x="0" y="622" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="642" font-size="12" fill="#5f6368" text-anchor="middle">18</text>
    <line y1="654" x2="1280" y2="654" stroke="#e8eaed"/>

    <rect x="0" y="654" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="674" font-size="12" fill="#5f6368" text-anchor="middle">19</text>
    <line y1="686" x2="1280" y2="686" stroke="#e8eaed"/>

    <rect x="0" y="686" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="706" font-size="12" fill="#5f6368" text-anchor="middle">20</text>

    <!-- Row number column separator -->

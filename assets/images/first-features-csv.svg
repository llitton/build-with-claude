    <text x="20" y="418" font-size="12" fill="#5f6368" text-anchor="middle">11</text>
    <line y1="430" x2="1280" y2="430" stroke="#e8eaed"/>
    <text x="50" y="418" font-size="13" fill="#202124">feature_request</text>

    <rect x="0" y="174" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="194" font-size="12" fill="#5f6368" text-anchor="middle">4</text>
    <line y1="206" x2="1280" y2="206" stroke="#e8eaed"/>
    <text x="50" y="194" font-size="13" fill="#202124">feature_request</text>
    <text x="190" y="194" font-size="13" fill="#202124">Attach photo to behavior award</text>
    <text x="450" y="194" font-size="13" fill="#202124">medium</text>
    <text x="590" y="194" font-size="13" fill="#202124">ABC Elementary</text>
    <text x="810" y="194" font-size="13" fill="#202124">"Teachers want to capture the moment"</text>

    <!-- Row 5 -->
    <rect x="0" y="206" width="40" height="32" fill="#f8f9fa"/>
    <text x="20" y="226" font-size="12" fill="#5f6368" text-anchor="middle">5</text>
    <line y1="238" x2="1280" y2="238" stroke="#e8eaed"/>
    <text x="50" y="226" font-size="13" fill="#202124">bug</text>
    <text x="190" y="226" font-size="13" fill="#202124">iPad app crashes on first launch</text>
    <text x="450" y="226" font-size="13" fill="#202124">medium</text>
    <text x="590" y="226" font-size="13" fill="#202124">ABC Elementary</text>
    <text x="810" y="226" font-size="13" fill="#202124">"Always happens once per day"</text>


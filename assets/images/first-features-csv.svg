    <line x1="440" y1="56" x2="440" y2="720" stroke="#e8eaed" stroke-width="1"/>
    <line x1="580" y1="56" x2="580" y2="720" stroke="#e8eaed" stroke-width="1"/>
    <line x1="800" y1="56" x2="800" y2="720" stroke="#e8eaed" stroke-width="1"/>
    <line x1="1280" y1="56" x2="1280" y2="720" stroke="#e8eaed" stroke-width="1"/>


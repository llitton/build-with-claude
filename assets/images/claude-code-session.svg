<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780"
     font-family="'SF Mono', Menlo, Monaco, 'Courier New', monospace">
  <defs>
    <clipPath id="terminal-clip">
      <rect width="1280" height="780" rx="8"/>
    </clipPath>
    <linearGradient id="titlebar-grad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3c3c3c"/>
      <stop offset="100%" stop-color="#2c2c2c"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#terminal-clip)">
    <!-- Terminal window background -->
    <rect width="1280" height="780" fill="#1d1f21"/>

    <!-- macOS Terminal title bar -->
    <rect width="1280" height="36" fill="url(#titlebar-grad)"/>
    <line x1="0" y1="36" x2="1280" y2="36" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Traffic lights -->
    <circle cx="20" cy="18" r="6" fill="#ff5f57" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="40" cy="18" r="6" fill="#febc2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="60" cy="18" r="6" fill="#28c840" stroke="#1aab29" stroke-width="0.5"/>

    <!-- Title -->
    <text x="640" y="22" font-size="12" fill="#c0c0c0" text-anchor="middle">claude — -zsh — 100×30 — ~/Desktop/call-extractor</text>

    <!-- Body content -->
    <!-- Shell prompt with `claude` command -->
    <text x="24" y="72" font-size="15" fill="#8ec07c">laura@MacBook-Pro</text>
    <text x="190" y="72" font-size="15" fill="#83a598">call-extractor</text>
    <text x="320" y="72" font-size="15" fill="#d4d4d4">% claude</text>

    <!-- Welcome box -->
    <text x="24" y="108" font-size="15" fill="#d19a66">╭───────────────────────────────────────────────╮</text>
    <text x="24" y="132" font-size="15" fill="#d19a66">│</text>
    <text x="48" y="132" font-size="15" fill="#d19a66">✻</text>
    <text x="76" y="132" font-size="15" fill="#d4d4d4">Welcome to Claude Code v1.0.42</text>
    <text x="660" y="132" font-size="15" fill="#d19a66">│</text>
    <text x="24" y="156" font-size="15" fill="#d19a66">│</text>
    <text x="60" y="156" font-size="15" fill="#7a8094">/help for help, /status for your status</text>
    <text x="660" y="156" font-size="15" fill="#d19a66">│</text>
    <text x="24" y="180" font-size="15" fill="#d19a66">│</text>
    <text x="660" y="180" font-size="15" fill="#d19a66">│</text>
    <text x="24" y="204" font-size="15" fill="#d19a66">│</text>
    <text x="60" y="204" font-size="15" fill="#7a8094">cwd: /Users/laura/Desktop/call-extractor</text>
    <text x="660" y="204" font-size="15" fill="#d19a66">│</text>
    <text x="24" y="228" font-size="15" fill="#d19a66">╰───────────────────────────────────────────────╯</text>

    <!-- User prompt -->
    <text x="24" y="276" font-size="15" fill="#d4d4d4">&gt; I'm building a Node.js script that reads call transcripts from a folder and</text>
    <text x="24" y="300" font-size="15" fill="#d4d4d4">  extracts feature requests as JSON. Walk me through it file by file. Start</text>
    <text x="24" y="324" font-size="15" fill="#d4d4d4">  with package.json and extract.js.</text>

    <!-- Claude response -->
    <text x="24" y="372" font-size="15" fill="#d19a66">⏺</text>
    <text x="48" y="372" font-size="15" fill="#d4d4d4">I'll set this up step by step. Here's the plan:</text>

    <text x="48" y="420" font-size="15" fill="#d4d4d4">1. Create package.json with @anthropic-ai/sdk and csv-writer</text>
    <text x="48" y="444" font-size="15" fill="#d4d4d4">2. Create extract.js (reads transcripts/, calls Claude, writes CSV)</text>
    <text x="48" y="468" font-size="15" fill="#d4d4d4">3. Create .env (with API key placeholder) and .gitignore</text>
    <text x="48" y="492" font-size="15" fill="#d4d4d4">4. Create transcripts/ folder with a sample call</text>

    <text x="48" y="540" font-size="15" fill="#7a8094">Starting with package.json...</text>

    <!-- Permission prompt — inline, no fancy box -->
    <text x="24" y="600" font-size="15" fill="#d4d4d4">Do you want to create this file?</text>

    <text x="24" y="636" font-size="15" fill="#8ec07c">❯</text>
    <text x="48" y="636" font-size="15" fill="#8ec07c">1. Yes</text>

    <text x="48" y="660" font-size="15" fill="#7a8094">2. No, and tell Claude what to do differently</text>

    <text x="48" y="684" font-size="15" fill="#7a8094">3. Yes, and don't ask again this session</text>

    <!-- Blinking cursor below the prompt -->
    <rect x="24" y="722" width="9" height="3" fill="#d4d4d4">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

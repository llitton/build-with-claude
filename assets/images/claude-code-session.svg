<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"
     font-family="'SF Mono', Menlo, Monaco, 'Courier New', monospace">
  <defs>
    <clipPath id="window-clip">
      <rect width="1280" height="720" rx="10"/>
    </clipPath>
    <filter id="window-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#window-clip)">
    <!-- Window background -->
    <rect width="1280" height="720" fill="#1a1b26"/>

    <!-- Title bar -->
    <rect width="1280" height="44" fill="#15161e"/>

    <!-- Traffic lights -->
    <circle cx="24" cy="22" r="6.5" fill="#ff5f57"/>
    <circle cx="46" cy="22" r="6.5" fill="#febc2e"/>
    <circle cx="68" cy="22" r="6.5" fill="#28c840"/>

    <!-- Title -->
    <text x="640" y="27" fill="#7a8094" font-size="13" text-anchor="middle">~/Desktop/call-extractor — claude</text>

    <!-- Header lines -->
    <text x="40" y="88" font-size="15" fill="#bb9af7" font-weight="700">Claude Code</text>
    <text x="160" y="88" font-size="15" fill="#565f89">v0.18.2</text>
    <text x="40" y="110" font-size="14" fill="#565f89">Working directory: ~/Desktop/call-extractor</text>

    <!-- User prompt marker -->
    <text x="40" y="166" font-size="16" fill="#bb9af7" font-weight="700">&gt;</text>

    <!-- User prompt body (green = user input) -->
    <text x="64" y="166" font-size="16" fill="#9ece6a" xml:space="preserve">I'm building a Node.js script that reads call transcripts from a</text>
    <text x="64" y="190" font-size="16" fill="#9ece6a" xml:space="preserve">folder and extracts feature requests as JSON. Walk me through it</text>
    <text x="64" y="214" font-size="16" fill="#9ece6a" xml:space="preserve">file by file. Use the latest Claude Sonnet model.</text>

    <!-- Claude's response intro -->
    <text x="40" y="266" font-size="16" fill="#c0caf5">I'll set this up step by step. Here's the plan:</text>

    <!-- Plan list -->
    <text x="64" y="314" font-size="16" fill="#e0af68" font-weight="700">1.</text>
    <text x="92" y="314" font-size="16" fill="#c0caf5" xml:space="preserve">Create </text>
    <text x="156" y="314" font-size="16" fill="#e0af68">package.json</text>
    <text x="270" y="314" font-size="16" fill="#c0caf5" xml:space="preserve">with @anthropic-ai/sdk and csv-writer</text>

    <text x="64" y="338" font-size="16" fill="#e0af68" font-weight="700">2.</text>
    <text x="92" y="338" font-size="16" fill="#c0caf5" xml:space="preserve">Create </text>
    <text x="156" y="338" font-size="16" fill="#e0af68">extract.js</text>
    <text x="248" y="338" font-size="16" fill="#c0caf5" xml:space="preserve">that reads </text>
    <text x="348" y="338" font-size="16" fill="#e0af68">transcripts/</text>
    <text x="460" y="338" font-size="16" fill="#c0caf5" xml:space="preserve">, calls Claude, and</text>

    <text x="92" y="362" font-size="16" fill="#c0caf5" xml:space="preserve">writes results to </text>
    <text x="252" y="362" font-size="16" fill="#e0af68">features.csv</text>

    <text x="64" y="386" font-size="16" fill="#e0af68" font-weight="700">3.</text>
    <text x="92" y="386" font-size="16" fill="#c0caf5" xml:space="preserve">Create </text>
    <text x="156" y="386" font-size="16" fill="#e0af68">.env</text>
    <text x="200" y="386" font-size="16" fill="#c0caf5" xml:space="preserve">(API key placeholder) and </text>
    <text x="438" y="386" font-size="16" fill="#e0af68">.gitignore</text>

    <text x="64" y="410" font-size="16" fill="#e0af68" font-weight="700">4.</text>
    <text x="92" y="410" font-size="16" fill="#c0caf5" xml:space="preserve">Create </text>
    <text x="156" y="410" font-size="16" fill="#e0af68">transcripts/</text>
    <text x="270" y="410" font-size="16" fill="#c0caf5" xml:space="preserve">folder with a sample call</text>

    <!-- First action -->
    <text x="40" y="466" font-size="16" fill="#c0caf5" xml:space="preserve">First action: create </text>
    <text x="222" y="466" font-size="16" fill="#e0af68">package.json</text>
    <text x="335" y="466" font-size="16" fill="#565f89" xml:space="preserve">(34 lines)</text>

    <!-- Permission box -->
    <rect x="40" y="500" width="700" height="128" fill="#1f2335" stroke="#414868" stroke-width="1" rx="6"/>

    <text x="60" y="528" font-size="13" fill="#f7768e" font-weight="700" letter-spacing="0.5">⚡  APPROVE ACTION</text>

    <text x="60" y="562" font-size="15" fill="#c0caf5" xml:space="preserve">Write file: </text>
    <text x="158" y="562" font-size="15" fill="#e0af68">package.json</text>

    <!-- Yes button (highlighted) -->
    <rect x="60" y="586" width="98" height="32" fill="#bb9af7" rx="4"/>
    <text x="109" y="608" font-size="14" fill="#1a1b26" font-weight="700" text-anchor="middle">Yes  ↵</text>

    <!-- Other options -->
    <text x="180" y="608" font-size="14" fill="#7a8094">No</text>
    <text x="220" y="608" font-size="14" fill="#414868">·</text>
    <text x="240" y="608" font-size="14" fill="#7a8094">Always allow file writes</text>

    <!-- Blinking cursor at the bottom -->
    <rect x="40" y="664" width="11" height="3" fill="#c0caf5">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
